# Sol Invictus off the Spaceport America rail, flown to impact.

name = "Sol Invictus - nominal"
initial_time_step = "0.01 s"
stop_event = "impact"

# RocketProperties
properties = { include = "../vehicles/sol_invictus.toml" }

# IntegrationConfiguration
[config.truth]
include = "../sites/spaceport_america.toml"

[config.truth.launch_rail]
length = "17 ft"
elevation = "85 deg"
azimuth = "0 deg"
friction_coefficient = 0.0

[config.sim]
relative_tolerance = 1e-6
position_tolerance = "1e-5 m"
velocity_tolerance = "1e-5 m/s"
angular_velocity_tolerance = "1e-6 rad/s"
orientation_tolerance = 1e-7
min_time_step = "1e-9 s"
event_time_tolerance = "1e-9 s"
max_event_iterations = 100

# RocketState at rest on the pad; the rail sets its orientation
[initial_state]
position = { value = [0.0, 0.0, 0.0], units = "m" }
velocity = { value = [0.0, 0.0, 0.0], units = "m/s" }
angular_velocity = { value = [0.0, 0.0, 0.0], units = "rad/s" }

# properties and config are filled in from the tables above
[[events]]
type = "flight_sim.events.peak_vertical_velocity"

[[events]]
ref = "flight_sim.events.APOGEE"

[[events]]
ref = "flight_sim.events.IMPACT"

[output]
directory = "../../out/{name}"
formats = ["csv"]
channels = ["*"]
sample_interval = "0.01 s"
plots = ["trajectory", "attitude", "aero", "propulsion", "step_length"]
