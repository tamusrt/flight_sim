name: Tell the dynamics site to rebuild

# The Predictions page and Vision on the dynamics site are built from this code. When it changes on the
# branch the site is built from, this sends the dynamics repository a message ("flight-sim-updated").
# Its workflow (.github/workflows/openrocket-sim.yml) listens for it and rebuilds the site.
#
# One-time setup: add a repository secret called DYNAMICS_DISPATCH_TOKEN here (Settings -> Secrets and
# variables -> Actions). It is a fine-grained personal access token that can write to the dynamics
# repository only: Contents "Read and write". Steps are in dynamics, tools/whatif/README.md, under
# "Rebuild the site when flight_sim changes". Without the secret this workflow only prints a warning.
#
# DYNAMICS_REPO is an optional repository variable, for a dynamics repository that is not tamusrt/dynamics.
on:
  push:
    branches: [main, Vision, EDITH]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/notify-dynamics.yml"
  workflow_dispatch:

permissions: {}   # nothing in this repository is read or changed

concurrency:
  group: notify-dynamics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the message to the dynamics repository
        env:
          TOKEN: ${{ secrets.DYNAMICS_DISPATCH_TOKEN }}
          TARGET: ${{ vars.DYNAMICS_REPO || 'tamusrt/dynamics' }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Dynamics site not told::The secret DYNAMICS_DISPATCH_TOKEN is not set, so the dynamics site was not told to rebuild. See the comments at the top of this workflow."
            exit 0
          fi
          body=$(jq -n --arg ref "$BRANCH" --arg sha "$COMMIT" \
            '{event_type: "flight-sim-updated", client_payload: {ref: $ref, sha: $sha}}')
          code=$(curl -sS -o reply.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET/dispatches" -d "$body")
          if [ "$code" != "204" ]; then
            echo "::error title=Dynamics site not told::GitHub answered $code: $(cat reply.txt)"
            echo "Check that the token can write to $TARGET and has not expired."
            exit 1
          fi
          echo "Told $TARGET to rebuild for $BRANCH ($COMMIT)." | tee -a "$GITHUB_STEP_SUMMARY"
