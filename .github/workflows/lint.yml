name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Ruff Check & Format
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Run Pylint
        run: |
          uv run pylint $(git ls-files '*.py')

      - name: Run Type Checking
        run: |
          uvx mypy .
