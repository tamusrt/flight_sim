# EDITH campaign: dispersed flights of the Sol Invictus example. Read with:
#
#   uv sync --extra edith
#   uv run edith examples/sol_invictus_mc/edith_config.toml
#
# Paths are relative to this file. The campaign file and output_dir may lie
# anywhere, the base sim's folder included. flight_sim reads this file as it
# reads sim input files, so include and extends work here too.

# Number of trials
num_sims = 500

# Seeds every draw. Each dispersion draws from its own stream, made from
# master_seed and the dispersion's key, so adding, removing or reordering
# dispersions leaves the other dispersions' samples unchanged.
master_seed = 9999

# The sim every trial disperses, read as flight_sim reads it: with its
# includes and defaults filled in and its paths made absolute.
base_sim = "../sol_invictus/sim.toml"

# Gets runs/, a folder per trial, and the Zarr store of the results
output_dir = "../../out/edith_sol_invictus"

# "lhs", Latin hypercube sampling, or "random". With "lhs", changing
# num_sims changes every trial's sample.
sampling = "lhs"

# Left out, EDITH picks these:
# workers = 7               # Worker processes; default: CPUs less one
# batch_size = 13           # Trials per batch and per Zarr chunk
# trial_timeout = "10 min"  # Longer trials stop as TIMEOUT; in s, min or h

# Stopping. Each batch is an independent replicate, and the apogee's standard
# error comes from the spread of the batch means. num_sims always caps the run.
#   rule = "fixed"           run all num_sims trials
#   rule = "standard_error"  stop once the apogee's standard error <= target
#   rule = "ci_half_width"   stop once its confidence interval's half-width
#                            <= target, at the given confidence
[stopping]
rule = "fixed"
# target = "5 m"
# confidence = 0.95

# ---------------------------------------------------------------------------
# Dispersions
#
# Each [dispersions."<key>"] table draws one value of the base sim for every
# trial. <key> is the value's key path in the sim's resolved input, the one
# flight_sim writes to each run folder as resolved_input.toml, with [i] after
# a list:
#
#   "properties.dry_mass_properties.mass"                  "17 kg"
#   "properties.dry_mass_properties.cg_location.value[0]"  -1.0 of a vector
#   "properties.dry_mass_properties.inertia.diag[1]"       135.0 of a diag
#   "config.truth.launch_rail.elevation"                   "85 deg"
#
# Included files sit under the key that includes them, wherever they are on
# disk: sim.toml includes vehicle.toml as properties, so the dry mass in
# vehicle.toml is "properties.dry_mass_properties.mass". A value the input
# leaves to its default can be dispersed too, such as
# "config.truth.atmosphere.barometric_pressure".
#
# dispersion names the class that draws the value. Left out, as in every
# table below, it is the standard one, the only one for now, which draws a
# number from the distribution dist_type names. Written out, it is:
#
#   dispersion = "StandardDispersion"
#
# dist_type = "normal"   sigma about the nominal value. Optional low and
#                        high truncate it, as absolute values on either
#                        side of the nominal value.
# dist_type = "uniform"  half_width either side of the nominal value, or
#                        from low to high, as absolute values.
#
# sigma, half_width, low and high carry units of the same kind as the
# nominal value's, such as "0.25 kg" or "5 mph", and EDITH converts them to
# the nominal value's units. A plain number in the input takes plain
# numbers: sigma = 0.05. A value in degC or degF takes its numbers in those
# units. A sigma or half_width of 0 keeps the value at its nominal.
# ---------------------------------------------------------------------------

# Dry mass, a placeholder 17 kg in vehicle.toml
[dispersions."properties.dry_mass_properties.mass"]
dist_type = "normal"
sigma = "0.25 kg"

# Dry CG along the body axis, from the nose tip
[dispersions."properties.dry_mass_properties.cg_location.value[0]"]
dist_type = "normal"
sigma = "2 cm"

# Rail elevation, never past vertical
[dispersions."config.truth.launch_rail.elevation"]
dist_type = "normal"
sigma = "0.5 deg"
high = "90 deg"

# Rail friction, a plain number in sim.toml, so its bounds are plain too
[dispersions."config.truth.launch_rail.friction_coefficient"]
dist_type = "uniform"
low = 0.0
high = 0.2

# Wind speed, anywhere from calm to 15 mph
[dispersions."config.truth.wind.speed"]
dist_type = "uniform"
low = "0 mph"
high = "15 mph"

# Wind direction, within 30 deg of the azimuth in site.toml
[dispersions."config.truth.wind.from_azimuth"]
dist_type = "uniform"
half_width = "30 deg"